name: iOS build

# Builds for the iOS Simulator only — no signing certificate needed
# (CODE_SIGNING_ALLOWED=NO), so this validates the whole Capacitor/Xcode
# pipeline without an Apple Developer account. A real device/TestFlight
# build needs signing set up separately once that account exists.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web export
        run: npm run build
        env:
          NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
          NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT_ID }}
          NEXT_PUBLIC_MAPTILER_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_KEY }}

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Build for iOS Simulator
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - uses: actions/upload-artifact@v4
        with:
          name: xanthus-ios-simulator-app
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 30
