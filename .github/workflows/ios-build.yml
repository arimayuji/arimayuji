name: iOS build

# Builds for the iOS Simulator (no signing certificate needed,
# CODE_SIGNING_ALLOWED=NO) so the whole Capacitor/Xcode pipeline is
# validated on every push regardless of secrets. On pushes to main, if the
# three APP_STORE_CONNECT_* secrets are configured, a second, signed
# archive is built and uploaded straight to TestFlight — as its own
# parallel job (see below), not a follow-on step of the simulator build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run at a time per ref — mainly to avoid burning duplicate macOS
# minutes (10x the cost of Linux minutes) on superseded pushes; this
# workflow doesn't deploy anywhere, so there's no ordering hazard like
# the Android one has, just cost. Always cancel the superseded run
# (PRs included, not just main) — a stale commit's build result is never
# needed once a newer one has pushed, on any ref.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap Linux gate (1x runner cost) in front of the two macOS jobs below
  # (10x runner cost, private repo — every minute here that never has to
  # run on macOS is a 10x savings). Catches the same tsc/lint failures the
  # macOS jobs used to catch themselves, just before either of them ever
  # spins up a macOS runner — `needs: checks` on both means a TS/lint error
  # now costs one ~1min Ubuntu job instead of two ~1min macOS jobs (about
  # 20x cheaper for that failure mode). Doesn't (and can't) catch Swift
  # compile errors — those only surface inside `xcodebuild` itself, so
  # that class of bug still needs either a real Xcode build (local, ideally
  # — free and faster than CI) or the `simulator` job below.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web export
        # Runs before the type-check step below: Next.js's typed-routes
        # feature generates globals like `LayoutProps<"/">` into
        # `.next/types` only as a side effect of `next build` — on a fresh
        # checkout `tsc --noEmit` fails with "Cannot find name
        # 'LayoutProps'" if it runs first, since that type doesn't exist yet.
        run: npm run build
        env:
          NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
          NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT_ID }}
          NEXT_PUBLIC_MAPTILER_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_KEY }}

      - name: Type-check and lint
        run: |
          npx tsc --noEmit
          npm run lint

      # `out/` is fully static (Next.js export) and identical regardless of
      # which runner OS produced it — sharing it saves each macOS job below
      # from re-running `next build` (~20s of 10x-priced time apiece) for
      # output this job already has. Never share node_modules the same way:
      # npm resolves OS-specific optional deps (native binaries for esbuild,
      # sharp, etc.), so a node_modules tree built on Ubuntu isn't safe to
      # reuse on macOS — those jobs still run their own `npm ci`.
      - uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: out/
          retention-days: 1

  # Split from a single sequential job into two independent ones: the
  # unsigned Simulator build (validates on every push/PR, no secrets
  # needed) and the signed TestFlight archive (only pushes to main, needs
  # secrets) no longer wait on each other — each redoes its own cheap setup
  # (npm ci, cap sync) in exchange for running its expensive Xcode work in
  # parallel with the other job. Each job also gets its own
  # SPM/DerivedData cache scope (see the cache steps below) — they build
  # genuinely different configurations (Debug-simulator vs. Release-archive)
  # into different DerivedData locations, so a shared cache key would only
  # ever help one of them anyway.
  simulator:
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: web-export
          path: out/

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      # Resolving Capacitor's Swift packages from scratch is most of this
      # job's time — caches the resolved packages and this job's own
      # DerivedData (`-derivedDataPath build` below) keyed off Package.swift,
      # so an unchanged dependency graph skips re-fetching.
      - uses: actions/cache@v4
        with:
          path: |
            ios/App/build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-simulator-spm-${{ hashFiles('ios/App/CapApp-SPM/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-simulator-spm-

      - name: Build for iOS Simulator
        working-directory: ios/App
        # COMPILER_INDEX_STORE_ENABLE=NO: the index store is Xcode's own
        # local code-intelligence data (search, autocomplete, refactoring)
        # — meaningless for a one-shot headless CI compile, and generating
        # it isn't free. Doesn't change the compiled output, just skips
        # writing data nothing here will ever read.
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build

      - uses: actions/upload-artifact@v4
        with:
          name: xanthus-ios-simulator-app
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 30

  testflight:
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 25
    # Only on main itself, same reasoning as the Android publish job —
    # never on PRs (including from forks), which shouldn't get App Store
    # Connect credentials. Gating the whole job (not just its last step)
    # means a PR run skips straight past the macOS minutes this job would
    # otherwise cost.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: web-export
          path: out/

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      # Own cache scope from the `simulator` job's — `xcodebuild archive`
      # below doesn't pass `-derivedDataPath`, so it writes to Xcode's
      # default location instead of `ios/App/build`; caching the wrong path
      # here would silently cache nothing useful for an archive build.
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-testflight-spm-${{ hashFiles('ios/App/CapApp-SPM/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-testflight-spm-

      - name: Build & upload signed archive to TestFlight
        # Skips gracefully (no failure) until the three secrets below are
        # configured — see README.
        #
        # Signing uses an App Store Connect API key instead of an Apple ID
        # login (`-authenticationKeyPath/-authenticationKeyID/
        # -authenticationKeyIssuerID -allowProvisioningUpdates`) — the
        # documented way to let `xcodebuild` create/renew the distribution
        # certificate and provisioning profile itself in CI, with nothing
        # interactive to click through. The project's target already has
        # CODE_SIGN_STYLE=Automatic (Capacitor's own default); DEVELOPMENT_TEAM
        # is passed on the command line since committing it to the project
        # isn't necessary for this to work.
        #
        # Any *literal* CODE_SIGN_IDENTITY (e.g. "Apple Distribution"), from
        # the CLI or from the project file itself, made Xcode 26 treat it as
        # a manual override and refuse it outright ("conflicting
        # provisioning settings... automatically signed for development, but
        # a conflicting code signing identity Apple Distribution has been
        # manually specified") — confirmed by trying both and hitting the
        # identical error either way. With no identity at all, automatic
        # signing instead defaulted to resolving a *Development* profile for
        # this Release archive (needs a registered physical device, which
        # this team has none of) instead of Distribution — ruled out an App
        # Store Connect API key permission issue too (the key is Admin).
        #
        # The actual fix, found by checking how Xcode Cloud itself invokes
        # xcodebuild for automatic-signing CI archives (Apple dev forums,
        # thread 756119): CODE_SIGN_IDENTITY=- is a sentinel ("let automatic
        # signing decide"), not a literal identity string, so it doesn't
        # trip the same manual-override conflict; AD_HOC_CODE_SIGNING_ALLOWED=YES
        # is needed alongside it so the build doesn't hard-fail before
        # automatic signing has resolved the real (Distribution) identity.
        #
        # CURRENT_PROJECT_VERSION (the build number, distinct from
        # MARKETING_VERSION="1.0") is set to this workflow's own run number —
        # App Store Connect rejects an upload whose build number isn't
        # strictly higher than the last one uploaded for the same version,
        # and a monotonic GitHub Actions run number guarantees that for
        # free, same trick as ANDROID_VERSION_CODE in the Android workflow.
        id: testflight
        working-directory: ios/App
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$KEY_P8_BASE64" ]; then
            echo "::warning::APP_STORE_CONNECT_KEY_ID/ISSUER_ID/API_KEY_P8 não configurados — pulando o upload pro TestFlight. Veja o README."
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          echo "$KEY_P8_BASE64" | base64 -d > "$KEY_PATH"

          AUTH_FLAGS=(-authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" -allowProvisioningUpdates)

          xcodebuild archive \
            -project App.xcodeproj -scheme App -configuration Release \
            -archivePath build/App.xcarchive -destination "generic/platform=iOS" \
            "${AUTH_FLAGS[@]}" \
            DEVELOPMENT_TEAM=6YJ97VWT8V CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>6YJ97VWT8V</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist \
            "${AUTH_FLAGS[@]}"

          xcrun altool --upload-app \
            -f build/ipa/App.ipa -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

          echo "uploaded=true" >> "$GITHUB_OUTPUT"
