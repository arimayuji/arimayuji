name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run at a time per ref — two overlapping runs both deploying to
# Cloudflare could interleave (an older, slower run's `wrangler deploy`
# landing after a newer run's, silently reverting the public APK to a
# stale build). `cancel-in-progress` only for pushes/dispatch to main:
# an in-flight deploy is safe to supersede with a newer one, but a PR
# run shouldn't cancel a sibling PR's run just because they share a
# branch name coincidentally.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Caches ~/.gradle (dependencies + wrapper + build cache) keyed off the
      # wrapper/lockfiles, shared across runs — without this every run
      # re-downloads the whole Android/Gradle dependency graph from scratch,
      # which was most of this workflow's wall-clock time.
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Install dependencies
        run: npm ci

      # Fails in seconds instead of after minutes of Gradle work — a typo
      # shouldn't cost a full native build to surface.
      - name: Type-check and lint
        run: |
          npx tsc --noEmit
          npm run lint

      - name: Build web export
        # NEXT_PUBLIC_* vars are optional here: Appwrite-backed features
        # (login, amigos, treinador) degrade gracefully to "unconfigured"
        # without them (see src/lib/appwrite.ts) — this build still produces
        # a working core app (corrida, histórico, GPS). To ship a fully
        # working APK, add these as repo secrets (Settings → Secrets and
        # variables → Actions).
        run: npm run build
        env:
          NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
          NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT_ID }}
          NEXT_PUBLIC_MAPTILER_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_KEY }}

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: xanthus-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build signed release APK
        # Skips gracefully (no failure) until ANDROID_RELEASE_KEYSTORE_BASE64
        # is configured — see README. PKCS12 keystores (what `keytool`
        # generates by default today) force the key password to equal the
        # store password, so only one password secret is needed.
        id: release_signing
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$ANDROID_RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::warning::ANDROID_RELEASE_KEYSTORE_BASE64/ANDROID_RELEASE_KEYSTORE_PASSWORD não configurados — publicando o build debug em vez do release. Veja o README para o passo manual."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/xanthus-release.keystore
          export ANDROID_RELEASE_KEYSTORE_PATH=/tmp/xanthus-release.keystore
          export ANDROID_RELEASE_KEY_ALIAS=xanthus
          export ANDROID_RELEASE_KEY_PASSWORD="$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          ./gradlew assembleRelease --no-daemon
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.release_signing.outputs.signed == 'true'
        with:
          name: xanthus-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish APK to a stable public link
        # Only on main itself — pushes to it or manual re-runs against it —
        # never on PRs (including from forks), which shouldn't get Cloudflare
        # deploy credentials. Drops the freshly built APK
        # into the already-built `out/` — no rebuild needed — so the next
        # `wrangler deploy` serves it alongside the site at a fixed path
        # that never expires or needs a GitHub login, unlike this run's own
        # artifacts above (30-day retention, requires auth to fetch). Prefers
        # the signed release build when available, falls back to the debug
        # one otherwise so the link stays live either way.
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret não configurado — pulando a publicação do APK. Veja o README para o passo manual."
            exit 0
          fi
          mkdir -p out/download
          if [ "${{ steps.release_signing.outputs.signed }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk out/download/xanthus.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk out/download/xanthus.apk
          fi
          echo "EXPECTED_SIZE=$(stat -c%s out/download/xanthus.apk)" >> "$GITHUB_ENV"
          npx wrangler deploy

      - name: Verify the public download link actually serves the new APK
        # Catches exactly the failure mode a manual out-of-band deploy hit
        # once already: a deploy that quietly ships without out/download/
        # (or ships an empty/truncated file) leaves the site itself fine
        # but breaks the one thing this whole step exists for. Checked
        # against this run's own build, not hardcoded, so it still catches
        # a stale CDN cache serving yesterday's APK.
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.CLOUDFLARE_API_TOKEN != ''
        run: |
          sleep 5
          ACTUAL_SIZE=$(curl -s -o /dev/null -w "%{size_download}" https://xanthus.yujiarima.workers.dev/download/xanthus.apk)
          if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ]; then
            echo "::error::Link público serve $ACTUAL_SIZE bytes, esperado $EXPECTED_SIZE — deploy pode ter quebrado o download."
            exit 1
          fi
          echo "OK — link público confirmado com $ACTUAL_SIZE bytes."
