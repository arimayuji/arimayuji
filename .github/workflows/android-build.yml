name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run at a time per ref — two overlapping runs both deploying to
# Cloudflare could interleave (an older, slower run's `wrangler deploy`
# landing after a newer run's, silently reverting the public APK to a
# stale build). `cancel-in-progress` only for pushes/dispatch to main:
# an in-flight deploy is safe to supersede with a newer one, but a PR
# run shouldn't cancel a sibling PR's run just because they share a
# branch name coincidentally.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  # Decides whether this push touches anything that actually ends up in the
  # native app bundle. The app's landing/download pages (src/app/page.tsx,
  # src/app/download/**) are real Next.js routes in the same codebase, but
  # a native launch skips straight past them (see standalone-gate.tsx) and
  # never renders them — so a change confined to those, or to things that
  # never ship at all (docs, dev scripts, the Cloudflare Worker proxy), has
  # zero effect on what Android/iOS actually show. Skipping a full
  # build+sign+Play-Store-publish cycle for that case is the single biggest
  # lever against this repo's GitHub Actions minutes (an Android release
  # alone is real Gradle+signing time; the iOS workflow's equivalent skip is
  # worth far more, at 10x the per-minute cost of a macOS runner).
  #
  # Deliberately an explicit safe *exclude* list, not an include list: an
  # unrecognized new file always falls through to "native=true" (rebuild),
  # so a gap in this list costs wasted CI minutes, never a silently
  # unshipped change. Only applies to ordinary pushes — pull_request and
  # workflow_dispatch always build everything (this job's own `if:` skips
  # it there, and debug/release below treat that skip as "run normally").
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name == 'push'
    outputs:
      native: ${{ steps.check.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        name: Decide whether this push touches anything that ships to the native app
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "First push seen on this ref — building everything to be safe."
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"
          SAFE_PATTERN='^(src/app/page\.tsx|src/app/download/|worker/|wrangler\.jsonc|scripts/|README\.md|PROJECT-CONTEXT\.md|SOCIAL-CONTEXT\.md|AGENTS\.md|CLAUDE\.md)'
          if echo "$CHANGED" | grep -vE "$SAFE_PATTERN" | grep -q .; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
            echo "Every changed file is web-only/never shipped — skipping native builds."
          fi

  # Builds the Next.js static export exactly once and shares it with every
  # job below that needs it (debug/release for `npx cap sync android`,
  # web-deploy for the site itself when this push also touched native code)
  # — same pattern ios-build.yml's own `checks` job already uses for its
  # macOS jobs, now applied here to cut out what used to be three
  # independent copies of the same `npm run build` (+ its own tsc/lint)
  # running back to back across debug/release/web-deploy. Same gating as
  # debug/release below — identical condition, so the two always run or
  # skip together.
  build-web:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.native == 'true')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Next.js's own incremental build cache (webpack/SWC compilation
      # cache — separate from, and never covered by, the npm dependency
      # cache above). Two-part key per Next.js's own CI caching guide: a
      # source hash for an exact hit, falling back to just the lockfile
      # hash so a dependency-only change (or the first build after this
      # cache existed) still reuses whatever's compilable instead of
      # starting cold.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build web export
        # Runs before the type-check step below: Next.js's typed-routes
        # feature generates globals like `LayoutProps<"/">` into
        # `.next/types` only as a side effect of `next build` (or `next
        # dev`) — on a fresh checkout `tsc --noEmit` fails with "Cannot
        # find name 'LayoutProps'" if it runs first, since that type
        # simply doesn't exist yet. NEXT_PUBLIC_* vars are optional here:
        # Appwrite-backed features (login, amigos, treinador) degrade
        # gracefully to "unconfigured" without them (see
        # src/lib/appwrite.ts) — this build still produces a working core
        # app (corrida, histórico, GPS). To ship a fully working APK, add
        # these as repo secrets (Settings → Secrets and variables →
        # Actions).
        run: npm run build
        env:
          NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
          # Browser-only override — worker/index.js proxies /v1/* same-origin
          # so the Appwrite session cookie is never cross-site there. Native
          # ignores this and keeps using the endpoint above directly (see
          # src/lib/appwrite.ts).
          NEXT_PUBLIC_APPWRITE_WEB_ENDPOINT: ${{ secrets.NEXT_PUBLIC_APPWRITE_WEB_ENDPOINT }}
          NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT_ID }}
          NEXT_PUBLIC_MAPTILER_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_KEY }}

      # Fails in seconds instead of after minutes of Gradle work — a typo
      # shouldn't cost a full native build to surface. Runs once here for
      # both debug and release now, instead of twice (one copy per job).
      - name: Type-check and lint
        run: |
          npx tsc --noEmit
          npm run lint

      - uses: actions/upload-artifact@v4
        with:
          name: android-web-export
          path: out/
          retention-days: 1

  # Split from a single sequential job into two independent ones: the debug
  # APK (needed on every push/PR for validation) and the release APK
  # (needed only for what actually ships) no longer wait on each other —
  # each redoes its own cheap setup (npm ci, cap sync) in exchange for
  # running its expensive Gradle work in parallel with the other job
  # instead of after it. Job names ("debug"/"release") double as the
  # Gradle cache key's scope (see setup-gradle below), so the two never
  # fight over the same cache entry.
  debug:
    needs: [changes, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.native == 'true')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Caches ~/.gradle (dependencies + wrapper + build cache) keyed off the
      # wrapper/lockfiles, shared across runs — without this every run
      # re-downloads the whole Android/Gradle dependency graph from scratch,
      # which was most of this workflow's wall-clock time.
      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: android-web-export
          path: out/

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: xanthus-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Wear OS companion app (tethered — see PROJECT-CONTEXT.md's
      # smartwatch section). Separate module (:wear), same applicationId,
      # never embedded into the phone APK via wearApp — best-effort so a
      # watch-module regression never blocks the phone APK this job exists
      # to validate.
      - name: Build Wear OS debug APK
        working-directory: android
        continue-on-error: true
        run: ./gradlew :wear:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: xanthus-wear-debug-apk
          path: android/wear/build/outputs/apk/debug/wear-debug.apk
          retention-days: 30
          if-no-files-found: ignore

  release:
    needs: [changes, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.native == 'true')
    # Feeds android/app/build.gradle's versionCode/versionName — the run
    # number only ever increases, so it doubles as the source of truth the
    # in-app update banner compares against (see version.json below).
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: "1.0.${{ github.run_number }}"
    # Exposes whether this run actually produced a signed build — the only
    # thing `release-publish`/`web-deploy` (separate jobs, no access to this
    # job's own step outputs) need to know from here.
    outputs:
      signed: ${{ steps.release_signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: android-web-export
          path: out/

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build signed release APK
        # Skips gracefully (no failure) until ANDROID_RELEASE_KEYSTORE_BASE64
        # is configured — see README. PKCS12 keystores (what `keytool`
        # generates by default today) force the key password to equal the
        # store password, so only one password secret is needed.
        id: release_signing
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$ANDROID_RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::warning::ANDROID_RELEASE_KEYSTORE_BASE64/ANDROID_RELEASE_KEYSTORE_PASSWORD não configurados — publicando o build debug em vez do release. Veja o README para o passo manual."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/xanthus-release.keystore
          # `export` here only lasts for this step's own shell process — it
          # does NOT carry over to the later "Build signed release AAB" step
          # (each `run:` block is a fresh shell). Writing to $GITHUB_ENV is
          # what actually persists these for the rest of the job; without
          # this, bundleRelease silently falls back to build.gradle's
          # unsigned branch (hasReleaseSigning = false) and produces an
          # .aab that Google Play then rejects with "todos os pacotes
          # enviados precisam ser assinados" — no build failure, no warning.
          {
            echo "ANDROID_RELEASE_KEYSTORE_PATH=/tmp/xanthus-release.keystore"
            echo "ANDROID_RELEASE_KEY_ALIAS=xanthus"
            echo "ANDROID_RELEASE_KEY_PASSWORD=$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"
          export ANDROID_RELEASE_KEYSTORE_PATH=/tmp/xanthus-release.keystore
          export ANDROID_RELEASE_KEY_ALIAS=xanthus
          export ANDROID_RELEASE_KEY_PASSWORD="$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          ./gradlew assembleRelease --no-daemon
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.release_signing.outputs.signed == 'true'
        with:
          name: xanthus-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # Google Play only accepts .aab (App Bundle), never .apk — a second
      # build from the same signed sources, reusing the exact same
      # signingConfig (android/app/build.gradle applies it to every release
      # variant, not just assembleRelease). Skipped when signing itself is
      # unconfigured — an unsigned bundle can't be uploaded to Play anyway.
      - name: Build signed release AAB
        if: steps.release_signing.outputs.signed == 'true'
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      # bundleRelease's own signReleaseBundle task runs with the exact same
      # signingConfig that correctly signs the APK above (confirmed via the
      # decoded keystore having a valid PKCS12 entry under the "xanthus"
      # alias) and reports BUILD SUCCESSFUL, but the .aab it produces has no
      # embedded signature at all — verified with Google's own bundletool
      # (`build-apks` without --ks falls back to a debug keystore, meaning
      # it found nothing to use), not just jarsigner. Root cause not
      # pinned down; jar-signing the .aab explicitly here is the documented
      # workaround for this exact AGP symptom and doesn't depend on
      # understanding why bundleRelease itself won't do it.
      - name: Jar-sign the AAB (bundleRelease produces an unsigned one)
        if: steps.release_signing.outputs.signed == 'true'
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$ANDROID_RELEASE_KEYSTORE_PATH" \
            -storepass "$ANDROID_RELEASE_KEY_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$ANDROID_RELEASE_KEY_ALIAS"
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      # Google Play requires the very first release to be uploaded by hand
      # through the Play Console (the API only publishes new versions of an
      # app that already exists there) — this artifact is that first .aab,
      # downloadable from the Actions run. It's also how `release-publish`
      # (a separate job — see its own comment for why) gets the signed .aab
      # it uploads to Play once GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is
      # configured and that manual upload has happened once.
      - uses: actions/upload-artifact@v4
        if: steps.release_signing.outputs.signed == 'true'
        with:
          name: xanthus-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # No debug APK to fall back to in this job anymore (that's the other
      # job now) — if signing isn't configured, this step builds an
      # unsigned-but-otherwise-identical debug APK just so the public link
      # always has something recent to serve.
      - name: Build fallback debug APK
        if: steps.release_signing.outputs.signed != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare publish payload (site deploy itself lives in web-deploy)
        # Used to also run `wrangler deploy` right here — split out so a
        # push that skips this whole job (see the `changes` job/README above)
        # doesn't drag the live site down with it. This step now only
        # produces the artifact `web-deploy` needs: the APK to publish,
        # whichever build actually happened (signed release, or the debug
        # fallback above when signing isn't configured), plus the
        # version.json src/lib/updateCheck.ts's in-app update banner reads.
        # `url` deliberately points at the /download instructions page, not
        # the raw .apk — the update notification used to link straight to
        # the binary, which handed Chrome's "arquivo pode ser nocivo"
        # interstitial to the user with zero context (same reasoning that
        # already made the landing page's own "Baixar APK" button point
        # here instead of the raw file — see src/app/download/page.tsx).
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p publish
          if [ "${{ steps.release_signing.outputs.signed }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk publish/xanthus.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk publish/xanthus.apk
          fi
          cat > publish/version.json <<EOF
          {"versionCode": ${ANDROID_VERSION_CODE}, "versionName": "${ANDROID_VERSION_NAME}", "url": "https://xanthus.app.br/download"}
          EOF

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: xanthus-publish-payload
          path: publish/
          retention-days: 1

  # Wear OS companion app's own release bundle — best-effort
  # (continue-on-error everywhere below), NOT wired into the Google Play
  # publish step in `release-publish`: that needs a first manual upload to
  # a "Wear" release track under the already-approved listing first (same
  # one-time trap the phone's "alpha" track had), which hasn't happened
  # yet. Split into its own job (previously ran serially inside
  # `release-publish`, after waiting on `release` to fully finish first)
  # so it builds in parallel with `release` instead of adding its own
  # Gradle+jarsign wall-clock on top of it — nothing here depends on
  # `release`'s signed phone artifact, only the same keystore + web export
  # `release` also starts from.
  wear-release:
    needs: [changes, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.native == 'true')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: android-web-export
          path: out/

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # Same keystore `release` uses for the phone APK/AAB — decoded again
      # here since nothing set via $GITHUB_ENV in that job carries over to
      # this one (every job is its own fresh runner).
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$ANDROID_RELEASE_KEY_PASSWORD" ]; then
            echo "::warning::ANDROID_RELEASE_KEYSTORE_BASE64/ANDROID_RELEASE_KEYSTORE_PASSWORD não configurados — pulando o build do Wear OS."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/xanthus-release.keystore
          {
            echo "ANDROID_RELEASE_KEYSTORE_PATH=/tmp/xanthus-release.keystore"
            echo "ANDROID_RELEASE_KEY_ALIAS=xanthus"
            echo "ANDROID_RELEASE_KEY_PASSWORD=$ANDROID_RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build Wear OS signed release AAB
        working-directory: android
        continue-on-error: true
        run: ./gradlew :wear:bundleRelease --no-daemon

      - name: Jar-sign the Wear OS AAB (same bundleRelease quirk as the phone AAB)
        continue-on-error: true
        run: |
          if [ -z "$ANDROID_RELEASE_KEYSTORE_PATH" ]; then
            exit 0
          fi
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$ANDROID_RELEASE_KEYSTORE_PATH" \
            -storepass "$ANDROID_RELEASE_KEY_PASSWORD" \
            android/wear/build/outputs/bundle/release/wear-release.aab \
            "$ANDROID_RELEASE_KEY_ALIAS"
          jarsigner -verify android/wear/build/outputs/bundle/release/wear-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: xanthus-wear-release-aab
          path: android/wear/build/outputs/bundle/release/wear-release.aab
          retention-days: 30
          if-no-files-found: ignore

  # Split out of `release` so the slowest, most website-irrelevant thing it
  # used to do — the actual Google Play upload — no longer sits on
  # `web-deploy`'s critical path. Before this split, `web-deploy`
  # (needs: release) couldn't start until ALL of `release` finished, Play
  # Store upload included; now it only waits on the phone APK/AAB being
  # built+signed, and this job's own slower work runs in parallel with the
  # site deploy instead of in front of it.
  #
  # Depends on `release` itself (needs its signed .aab, uploaded as the
  # `xanthus-release-aab` artifact — build outputs don't otherwise survive
  # across jobs/runners) so it's not truly concurrent with `release`, just
  # with `web-deploy`, which is the half of the old single job that
  # actually benefits from not waiting. Doesn't need `wear-release` at
  # all — the Wear artifact isn't part of this publish step (see that
  # job's own comment) — nor npm/Java/Gradle anymore, now that the only
  # thing left to build here (the Wear bundle) moved out: this job is just
  # "download the phone .aab, upload it to Play."
  release-publish:
    needs: [changes, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      always() &&
      needs.release.result == 'success' &&
      needs.release.outputs.signed == 'true'
    steps:
      - name: Download the signed phone AAB from `release`
        uses: actions/download-artifact@v4
        with:
          name: xanthus-release-aab
          path: android/app/build/outputs/bundle/release/

      - name: Check Google Play service account secret
        # Same secrets-can't-appear-in-`if`-expressions workaround used
        # elsewhere in this file: compute the yes/no in a run: step's own
        # output instead.
        id: play_secret_check
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON não configurado — pulando o upload pro Google Play. Veja o README."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Sobe pro track "alpha" — o nome real, confirmado pela própria API do
      # Google, da faixa que o Console mostra como "Teste fechado - Alpha"
      # (a mesma correspondência já vista quando "open" deu 404: "Available
      # tracks are: production,beta,alpha,internal" — beta = Teste Aberto,
      # alpha = Teste Fechado).
      #
      # Histórico da decisão, pra não repetir o mesmo raciocínio errado de
      # novo: cogitou-se "production" primeiro, descartado porque contas de
      # desenvolvedor novas (a nossa foi aprovada em 2026-08-21) exigem um
      # teste fechado com 12+ testadores por 14 dias antes de liberar
      # Produção. Depois cogitou-se "open", por analogia com o TestFlight
      # External Testing do iOS — **essa analogia estava errada**: no
      # Android, ao contrário do iOS, a faixa Aberta *também* exige acesso
      # de Produção primeiro (confirmado direto na UI do Play Console:
      # cadeado + "o teste aberto fica disponível quando você tem o acesso
      # de produção"). Não existe atalho — o Teste Fechado é o único
      # caminho real pra qualquer conta nova, então é ele que vale a pena
      # automatizar. Publicado manualmente pela primeira vez em 2026-08-25
      # (rascunho vazio descartado, permissão de localização/vídeo/ID de
      # publicidade preenchidos, versão aprovada) com testadores reais já
      # inscritos — builds novos precisam continuar chegando nessa MESMA
      # faixa pra esses testadores receberem atualização, senão ficam
      # travados pra sempre na versão aprovada manualmente.
      #
      # "internal" (usado como workaround temporário entre 2026-08-24 e
      # 2026-08-25, enquanto nenhuma faixa pública existia de verdade) não
      # serve mais como destino principal: quem está inscrito no Teste
      # Fechado não recebe update nenhum de um build publicado só no
      # Interno — são faixas paralelas, não uma escada automática.
      #
      # A PRIMEIRA versão de qualquer faixa nova ainda precisa ser enviada
      # manualmente pelo Play Console — a API do Google não cria a ficha do
      # app nem a primeira versão de uma faixa do zero, só publica versões
      # novas de uma faixa que já existe. Este step só funciona depois
      # desse primeiro upload manual (já feito pra "alpha" em 2026-08-25).
      - name: Publish AAB to Google Play (Teste fechado — Alpha)
        uses: r0adkll/upload-google-play@v1
        if: steps.play_secret_check.outputs.configured == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        # Best-effort — a failure here (wrong API scope, API not enabled
        # yet, quota, whatever) must never block the job, and no longer can
        # take the site deploy down with it now that `web-deploy` doesn't
        # depend on this job at all. Confirmed this actually happened once
        # already (2026-08-21), back when the site deploy itself lived in
        # the same job as this step: the very first automated Play Store
        # push failed here and the site never got the update that same
        # push was supposed to ship.
        continue-on-error: true
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.xanthus.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: alpha
          status: completed

  # Deploys the actual website (xanthus.app.br) — split out from `release`
  # so a push the `changes` job decided is web-only/never-shipped still
  # updates the live site without paying for a full Android build+sign
  # cycle, and (via `release-publish` above) no longer waits on Play Store
  # upload or the Wear OS bundle even when this push DID touch native code.
  # When `release` DID run, publishes the fresh APK it just built alongside
  # the new site; otherwise re-embeds whatever APK is already live so the
  # download link never goes stale/missing (Cloudflare Workers Assets
  # replaces the whole asset set on every deploy — omitting the APK here
  # would 404 it, not just leave it unchanged).
  web-deploy:
    needs: [changes, build-web, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.release.result != 'failure' && needs.release.result != 'cancelled'
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use the shared web export (this push already built one for the native jobs)
        if: needs.release.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-web-export
          path: out/

      - name: Build web export (no native job ran this push to share one with)
        if: needs.release.result != 'success'
        run: npm run build
        env:
          NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
          NEXT_PUBLIC_APPWRITE_WEB_ENDPOINT: ${{ secrets.NEXT_PUBLIC_APPWRITE_WEB_ENDPOINT }}
          NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT_ID }}
          NEXT_PUBLIC_MAPTILER_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_KEY }}

      - name: Use the APK this push just built
        if: needs.release.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: xanthus-publish-payload
          path: out/download/

      - name: Reuse the already-live APK (this push didn't touch anything native)
        if: needs.release.result != 'success'
        run: |
          mkdir -p out/download
          curl -sS --fail -o out/download/xanthus.apk https://xanthus.app.br/download/xanthus.apk
          curl -sS --fail -o out/download/version.json https://xanthus.app.br/download/version.json

      - name: Deploy to Cloudflare
        # Only on main itself — pushes to it or manual re-runs against it —
        # never on PRs (including from forks), which shouldn't get
        # Cloudflare deploy credentials (this job's own `if:` above already
        # excludes PRs entirely, this guard is just the secret-not-configured
        # case for a real push to main).
        id: deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret não configurado — pulando a publicação do site. Veja o README para o passo manual."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "EXPECTED_SIZE=$(stat -c%s out/download/xanthus.apk)" >> "$GITHUB_ENV"
          VERSION_NAME=$(node -e "console.log(require('./out/download/version.json').versionName)")
          # The download URL itself has to stay the fixed "xanthus.apk" path
          # above — that's what makes it a stable link the landing page and
          # the in-app update banner never need to change. But what the
          # browser actually SAVES the file as can still be friendlier: this
          # appends a rule to the `_headers` file (already copied into out/
          # from public/_headers by `next build`, with its own
          # Access-Control-Allow-Origin rule for this same path — a
          # different header name, so both rules apply without conflict)
          # telling Cloudflare to send a versioned Content-Disposition
          # filename, so what lands in the user's Downloads folder reads
          # "Xanthus-1.0.87.apk" instead of the generic "xanthus.apk".
          cat >> out/_headers <<EOF

          /download/xanthus.apk
            Content-Disposition: attachment; filename="Xanthus-${VERSION_NAME}.apk"
          EOF
          npx wrangler deploy
          echo "published=true" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify the public download link actually serves the current APK
        # Catches exactly the failure mode a manual out-of-band deploy hit
        # once already: a deploy that quietly ships without out/download/
        # (or ships an empty/truncated file) leaves the site itself fine
        # but breaks the one thing this whole step exists for. Checked
        # against this run's own build, not hardcoded, so it still catches
        # a stale CDN cache serving yesterday's APK. Gated on the previous
        # step's own output rather than `secrets` directly — the `secrets`
        # context isn't a valid named-value inside a step `if:` expression
        # (confirmed the hard way: it fails workflow parsing entirely,
        # silently blocking every trigger, not just this one step).
        if: steps.deploy.outputs.published == 'true'
        run: |
          # A single check right after deploy can catch a CDN edge that
          # hadn't propagated yet — a false alarm, not a broken deploy (hit
          # this for real once already: run failed here while the actual
          # download worked fine seconds later). Retries give propagation
          # a real window instead of failing the whole release on the first
          # stale read.
          for attempt in 1 2 3 4 5; do
            sleep 5
            ACTUAL_SIZE=$(curl -s -o /dev/null -w "%{size_download}" https://xanthus.yujiarima.workers.dev/download/xanthus.apk)
            if [ "$ACTUAL_SIZE" = "$EXPECTED_SIZE" ]; then
              echo "OK — link público confirmado com $ACTUAL_SIZE bytes (tentativa $attempt)."
              exit 0
            fi
            echo "::warning::Tentativa $attempt: link público serve $ACTUAL_SIZE bytes, esperado $EXPECTED_SIZE — pode ser cache de CDN ainda propagando."
          done
          echo "::error::Link público serve $ACTUAL_SIZE bytes, esperado $EXPECTED_SIZE após 5 tentativas — deploy pode ter quebrado o download."
          exit 1

      - name: Notify Android accounts that a new version shipped
        # Only when `release` actually shipped a genuinely new build this
        # push — a web-only redeploy that just re-embeds the already-live
        # APK unchanged has nothing new to announce. Best-effort: a missing
        # secret or a failed push must never block the deploy that just
        # succeeded above. Only reaches accounts that are signed in and
        # have push registered (see src/lib/pushNotifications.ts) — a
        # nice-to-have nudge, not the update mechanism itself. `data.route`
        # (read by listenForPushNotificationTaps in pushNotifications.ts)
        # sends a tap straight to /download's step-by-step instead of just
        # opening the app to wherever it happened to launch — sideloaded
        # APK installs on Android have no auto-update, so "toque pra
        # atualizar" needs to actually land somewhere that walks through it.
        # `messageId` is deterministic per version code specifically so a
        # workflow re-run for the same build can't double-notify — Appwrite
        # rejects the second create as a conflict instead.
        if: needs.release.result == 'success' && steps.deploy.outputs.published == 'true'
        continue-on-error: true
        env:
          NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
          NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT_ID }}
          APPWRITE_MESSAGING_API_KEY: ${{ secrets.APPWRITE_MESSAGING_API_KEY }}
        run: |
          if [ -z "$APPWRITE_MESSAGING_API_KEY" ]; then
            echo "::warning::APPWRITE_MESSAGING_API_KEY não configurado — pulando o aviso de nova versão. Veja o README."
            exit 0
          fi
          curl -sS --fail-with-body -X POST "$NEXT_PUBLIC_APPWRITE_ENDPOINT/messaging/messages/push" \
            -H "Content-Type: application/json" \
            -H "X-Appwrite-Project: $NEXT_PUBLIC_APPWRITE_PROJECT_ID" \
            -H "X-Appwrite-Key: $APPWRITE_MESSAGING_API_KEY" \
            -d "{\"messageId\":\"android-update-${ANDROID_VERSION_CODE}\",\"title\":\"Nova versão disponível\",\"body\":\"Toque pra ver o passo a passo de como atualizar.\",\"topics\":[\"android-updates\"],\"data\":{\"route\":\"/download\"}}"
