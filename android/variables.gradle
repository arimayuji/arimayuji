ext {
    // 26, not the Capacitor-template default of 24 — capacitor-health
    // (src/lib/health.ts) pulls in androidx.health.connect:connect-client,
    // which hard-requires API 26 in its own manifest (Health Connect itself
    // doesn't exist below Android 8.0, so there's no lower-minSdk build of
    // it to depend on instead). Bumping this only drops Android 7.x and
    // older, a vanishingly small slice of real devices at this point.
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}