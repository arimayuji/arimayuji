include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

// Tethered Wear OS companion app — same applicationId/signing as :app,
// published as its own .aab on a separate Wear form-factor track under
// the same Play Store listing (not the classic wearApp-embedding model).
// Hand-maintained here, never in capacitor.settings.gradle below (that
// file is auto-generated by `cap sync android` and isn't a Capacitor
// plugin module).
include ':wear'

apply from: 'capacitor.settings.gradle'