<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!--
    The compact bust mark (HORSE_BUST_PATHS in src/app/horse-mark.tsx), not
    the full-body mark this file used before — the full-body one was only
    ever proven out at real display size (the landing hero watermark) and
    turns into an illegible smudge at favicon/homescreen-icon size. The bust
    was purpose-built as "the small-badge half of the brand system" (see
    horse-mark.tsx's own comment) and is already proven at small size on the
    showcase shoe's logo patch. Kept byte-identical to public/pwa-icon.svg on
    purpose: an external .svg cannot share a <defs> with another file, so the
    ramp is duplicated rather than referenced. Edit both together.

    Chrome finish: polished metal does not read as one flat colour, so the
    ramp alternates specular spikes (near-white) with shadow troughs
    (near-ink blue) crossing the whole mark along one ~125deg diagonal.
    gradientUnits="userSpaceOnUse" is load-bearing — the mark is several
    separate paths, and the default objectBoundingBox would give each one
    its own private rainbow instead of one shared light source.
  -->
  <defs>
    <linearGradient id="xanthusChrome" gradientUnits="userSpaceOnUse" x1="15" y1="0" x2="85" y2="100">
      <stop offset="0" stop-color="#2f6fed"/>
      <stop offset="0.07" stop-color="#1a4098"/>
      <stop offset="0.16" stop-color="#5b8dff"/>
      <stop offset="0.225" stop-color="#d8e6ff"/>
