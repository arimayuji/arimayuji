      <stop offset="0.278" stop-color="#a9c6ff"/>
      <stop offset="0.3" stop-color="#2f62d4"/>
      <stop offset="0.345" stop-color="#16357e"/>
      <stop offset="0.355" stop-color="#3f74e6"/>
      <stop offset="0.44" stop-color="#6d9bff"/>
      <stop offset="0.51" stop-color="#b9d0ff"/>
      <stop offset="0.55" stop-color="#f7faff"/>
      <stop offset="0.6" stop-color="#86adff"/>
      <stop offset="0.66" stop-color="#2f6fed"/>
      <stop offset="0.72" stop-color="#1a4098"/>
      <stop offset="0.775" stop-color="#4a80f0"/>
      <stop offset="0.845" stop-color="#dbe8ff"/>
      <stop offset="0.868" stop-color="#ffffff"/>
      <stop offset="0.895" stop-color="#93b7ff"/>
      <stop offset="0.95" stop-color="#2450b5"/>
      <stop offset="1" stop-color="#4278e8"/>
    </linearGradient>
  </defs>
