<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!--
    The horse rearing in silhouette in front of a "moon" — the disc reads as
    the brand's accent blue (darker toward the rim, a soft glow at the
    centre, the same "something is lighting it from the front" cue a real
    photographed silhouette would have), the horse a flat dark cutout on top
    rather than the chrome-outline treatment this file used before. One
    accent survives from that older treatment: a bright silver-metal glint
    clipped to just the raised foreleg/hoof (the signature of the rampant
    pose), so the mark still reads as "metal" somewhere without going back
    to painting the whole horse that way.

    Kept byte-identical to src/app/icon.svg on purpose: an external .svg
    cannot share a <defs> with another file, so this is duplicated there
    rather than referenced. Edit both together.
  -->
