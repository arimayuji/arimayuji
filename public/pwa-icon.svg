  <!--
    The full-body brand mark (same paths as the landing hero's watermark in
    src/app/page.tsx), not the compact header bust — this is the one that
    actually reads as "the logo" everywhere it's shown at real size. Kept
    byte-identical to public/pwa-icon.svg on purpose: an external .svg
    cannot share a <defs> with another file, so the ramp is duplicated
    rather than referenced. Edit both together.

    Chrome finish: polished metal does not read as one flat colour, so the
    ramp alternates specular spikes (near-white) with shadow troughs
    (near-ink blue) crossing the whole mark along one ~125deg diagonal.
    gradientUnits="userSpaceOnUse" is load-bearing — the mark is several
    separate paths, and the default objectBoundingBox would give each one
    its own private rainbow instead of one shared light source.
  -->
