<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <!--
    Chrome finish. Polished metal does not read as one flat colour: the
    surface mirrors a bright sky, a dark horizon, then sky again, so the ramp
    alternates specular spikes (near-white) with shadow troughs (near-ink
    blue) three times along a ~125 degree diagonal, with one hard edge at
    0.345/0.355 standing in for the horizon line. Brand blue holds the
    mid-tones so the mark still reads as our blue rather than grey.

    gradientUnits="userSpaceOnUse" is load-bearing: the mark is several
    separate paths, and the default objectBoundingBox would give each hoof
    and eye-tick its own private rainbow instead of one light source
    crossing the whole animal.
  -->
  <defs>
    <linearGradient id="xanthusChrome" gradientUnits="userSpaceOnUse" x1="15" y1="0" x2="85" y2="100">
      <stop offset="0" stop-color="#2f6fed"/>
      <stop offset="0.07" stop-color="#1a4098"/>
      <stop offset="0.16" stop-color="#5b8dff"/>
      <stop offset="0.225" stop-color="#d8e6ff"/>
      <stop offset="0.245" stop-color="#ffffff"/>
      <stop offset="0.262" stop-color="#ffffff"/>
      <stop offset="0.278" stop-color="#a9c6ff"/>
      <stop offset="0.3" stop-color="#2f62d4"/>
      <stop offset="0.345" stop-color="#16357e"/>
      <stop offset="0.355" stop-color="#3f74e6"/>
      <stop offset="0.44" stop-color="#6d9bff"/>
      <stop offset="0.51" stop-color="#b9d0ff"/>
      <stop offset="0.55" stop-color="#f7faff"/>
      <stop offset="0.6" stop-color="#86adff"/>
      <stop offset="0.66" stop-color="#2f6fed"/>
      <stop offset="0.72" stop-color="#1a4098"/>
      <stop offset="0.775" stop-color="#4a80f0"/>
      <stop offset="0.845" stop-color="#dbe8ff"/>
      <stop offset="0.868" stop-color="#ffffff"/>
      <stop offset="0.895" stop-color="#93b7ff"/>
      <stop offset="0.95" stop-color="#2450b5"/>
      <stop offset="1" stop-color="#4278e8"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0b0e11"/>
  <g stroke="url(#xanthusChrome)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 81,38
             C 83,40 83,43 81,44
             C 79,45 77,44 76,42
             C 72,43 67,43 63,40
             C 61,38 60,36 60,34
             C 58,43 53,53 48,62
             C 54,62 60,64 65,68
             C 68,71 70,74 72,77
             C 79,76 87,78 90,82
             C 92,85 91,88 88,89
             C 84,90 76,90 70,89
             C 66,88 64,85 65,81
             C 64,78 62,75 60,73
             C 56,72 52,71 48,70
             C 45,76 42,81 38,86
             C 34,90 29,90 27,85
             C 23,80 19,75 18,70
             C 21,68 24,67 26,64
             C 24,58 21,51 20,45
             C 23,43 27,42 30,40
             C 29,35 28,29 29,24
             C 32,26 35,27 38,28
             C 42,25 48,21 55,17
             C 54,12 56,9 59,10
             C 61,12 61,15 60,17
             C 62,13 64,12 66,14
             C 67,16 67,19 66,21
             C 71,26 77,32 81,38 Z"/>
    <path d="M 66,85 C 74,86.5 82,86.5 90,84.5"/>
    <path d="M 75,78 L 76,83 M 80,78.5 L 81,83.5"/>
    <path d="M 67,30 L 69,31"/>
  </g>
</svg>
